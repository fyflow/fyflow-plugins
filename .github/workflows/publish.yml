# On every push to main: build index.json (and index.html) from plugins/*.json, each version's `published` from git
# history, validate it against the Host's schema, and deploy it to GitHub Pages, where a Host reads
# https://fyflow.github.io/fyflow-plugins/index.json. It runs no Plugin code.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history: `published` is the first commit that added each version
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-index.ts --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}index.json
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
